module: myeasymocap.stages.basestage.MultiStage 
#emc --data config/datasets/mvimage.yml --exp  config/mvmp/detect_match_triangulate_fitSMPLX.yml --root ../Data/Group1 --out  ../Data/Group1/limb_test --ranges 0 10 1
args:
  output: output/detect_match_triangulate
  keys_keep: [cameras, imgnames]
  at_step:
    detect:
      module: myeasymocap.backbone.yolo.yolo.MultiPerson # Use YOLO to detect multi-person
      key_from_data: [images, imgnames]
      args:
        model: yolov5m
        name: person
        min_length: 0 # this two threshold control the wanted bboxes
        max_length: 4000
    # keypoints2d:
    #   module: myeasymocap.backbone.hrnet.myhrnet.MyHRNet
    #   key_from_data: [images, imgnames]
    #   key_from_previous: [bbox]
    #   key_keep: []
    #   args:
    #     ckpt: data/models/pose_hrnet_w48_384x288.pth
    #     single_person: False # This flag controls the function to detect all keypoints
    keypoints2d:
      # skip: True
      module: myeasymocap.backbone.vitpose.vit_moe.MyViT_WholeBody
      key_from_data: [images, imgnames]
      key_from_previous: [bbox]
      key_keep: []
      args:
        ckpt: data/models/vitpose+_base.pth
        single_person: false # This flag controls the function to detect all keypoints
    vis_2d:
      module: myeasymocap.io.vis.Vis2D
      skip: True
      key_from_data: [images]
      key_from_previous: [keypoints, bbox]
      args:
        name: vis_keypoints2d
        scale: 0.5
    match:
      module: myeasymocap.operations.match_base.MatchAndTrack
      # skip: True
      key_from_data: [cameras, meta]
      key_from_previous: [keypoints]
      args:
        cfg_match:
          min_conf: 0.3
          min_joints: 20
          distance:
            mode: epipolar
            threshold: 0.03 # 用于控制匹配的内点阈值
            threshold_track: 0.05 # track的匹配的内点阈值
            min_common_joints: 15
            cfg_svt:
              debug: 0
              maxIter: 100
              w_sparse: 0.1
              w_rank: 50
              tol: 0.0001
              aff_min: 0.3
          triangulate:
            min_view: 2 # min view when triangulate each points
            min_view_body: 5 # min visible view of the body
            min_conf_3d: 0.05
            dist_max: 60 # pixel
            dist_track: 300 # mm
        cfg_track:
          max_person: 100
          max_missing: 1 # 最多丢失3帧就要删除
          final_ranges: [[-10000, -10000, -10000], [10000, 10000, 10000]] # 最终的输出的range，仅用于输出的时候的筛选
          final_max_person: 100
          # Connects: Shoulders, Arms, Hips, Legs
          kintree: [[5, 6], [5, 7], [7, 9], [6, 8], [8, 10], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [5, 11], [6, 12]]
    vis_kpts3d:
      module: myeasymocap.io.vis.Vis3D
      skip: True
      key_from_data: [images, cameras]
      key_from_previous: [results] # 用于最后的一起优化
      args:
        scale: 0.5
        lw_factor: 10
  at_final:
    write_raw: # write the raw 3d keypoints
      module: myeasymocap.io.write.WriteAll
      # skip: True
      key_from_data: [results, meta]
      args:
        name: keypoints3d_raw
    collect: # split the results of each frame to each person
      # module: myeasymocap.stages.collect.CollectMultiPersonMultiFrame
      # # skip: True
      # key_from_data: [keypoints3d, pids]
      # args:
      #   key: keypoints3d
      #   min_frame: 20
      module: myeasymocap.stages.collect.CollectMultiPersonMultiFrameWithGapFill
      key_from_data: [keypoints3d, pids]
      args:
        key: keypoints3d
        min_frame: 20
        max_dist: 0.5      # 公尺，距離超過此值的短 pid 不被採用為填補
        conf_thresh: 0.1   # 軀幹點 confidence 閾值
        # n_main: 2
        merge_dist: 0.1      # ← 從 0.3 降到 0.15，避免誤合併
        max_overlap: 5
        lookback: 100 

    vis_collected_kpts: 
      module: myeasymocap.io.vis.VisCollectedKeypoints
      skip: True
      key_from_data: [cameras, imgnames]
      key_from_previous: [results] # Uses the output from 'collect'
      args:
        name: vis_collected_kpts3d
        scale: 0.5
        lw_factor: 5

    load_body_model: # 载入身体模型
      module: myeasymocap.io.model.SMPLXLoader
      # skip: True
      args:
        model_path: data/smplx/smplx/SMPLX_NEUTRAL.pkl
        regressor_path: data/smplx/J_regressor_body25_smplx.txt
    #   # 这个模块返回两个内容：body_model, model; 其中的body_model是用来进行可视化的
    fitting_each_person:
      module: myeasymocap.stages.basestage.StageForFittingEach
      # skip: True
      key_from_previous: [model, results]
      key_from_data: []
      args:
        stages: _file_/config/mvmp/meta_fit_SMPLX_face.yml
        keys_keep: [params]
    write:
      module: myeasymocap.io.write.WriteSMPL
      # skip: True
      key_from_data: [meta]
      key_from_previous: [results, model]
      args:
        name: smplx
    vis_render:
      module: myeasymocap.io.vis3d.RenderAll_multiview
      # skip: True
      key_from_data: [meta, cameras, imgnames]
      key_from_previous: [results, body_model]
      args:
        backend: pyrender
        view_list: [0,4,8,12]
        scale: 0.5
    make_video:
      module: myeasymocap.io.video.MakeVideo
      # skip: True
      args:
        fps: 30
        keep_image: True